<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261a33" />
      <stop offset="100%" stop-color="#180e24" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="185" fill="#151024" opacity="0.4" />

  <!-- Stars / Sparkles -->
  <path d="M 80,100 Q 90,100 90,90 Q 90,100 100,100 Q 90,100 90,110 Q 90,100 80,100 Z" fill="#fde047" opacity="0.9" />
  <path d="M 310,90 Q 320,90 320,80 Q 320,90 330,90 Q 320,90 320,100 Q 320,90 310,90 Z" fill="#f472b6" opacity="0.9" />
  <path d="M 330,240 Q 338,240 338,232 Q 338,240 346,240 Q 338,240 338,248 Q 338,240 330,240 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 70,260 Q 76,260 76,254 Q 76,260 82,260 Q 76,260 76,266 Q 76,260 70,260 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Back Hair -->
  <path d="M 120,170 Q 90,260 120,330 Q 200,350 280,330 Q 310,260 280,170 Z" fill="url(#hairGrad)" />

  <!-- Body / Shoulders -->
  <path d="M 110,380 C 120,310 160,285 200,285 C 240,285 280,310 290,380 Z" fill="url(#shirtGrad)" />
  <path d="M 175,285 L 200,320 L 225,285 Z" fill="#e2a06c" />

  <!-- Neck -->
  <rect x="182" y="240" width="36" height="50" rx="10" fill="#f0ab76" />

  <!-- Head / Face -->
  <path d="M 135,165 C 135,110 265,110 265,165 C 265,228 235,265 200,265 C 165,265 135,228 135,165 Z" fill="#fbb07e" />

  <!-- Hair Base Top -->
  <path d="M 130,155 C 130,90 270,90 270,155 C 270,140 240,115 200,115 C 160,115 130,140 130,155 Z" fill="url(#hairGrad)" />
  <!-- Side Banging / Waves -->
  <path d="M 130,150 C 150,150 170,165 175,190 C 165,185 145,175 135,195 C 130,175 125,160 130,150 Z" fill="url(#hairGrad)" />
  <path d="M 270,150 C 250,150 230,165 225,190 C 235,185 255,175 265,195 C 270,175 275,160 270,150 Z" fill="url(#hairGrad)" />

  <!-- Cute Eyebrows -->
  <path d="M 155,162 Q 170,158 180,163" stroke="#261a33" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 220,163 Q 230,158 245,162" stroke="#261a33" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Big Sparkling Anime / Stylized Eyes -->
  <ellipse cx="168" cy="180" rx="9" ry="12" fill="#180e24" />
  <circle cx="166" cy="176" r="3.5" fill="#ffffff" />
  <circle cx="171" cy="184" r="1.5" fill="#ffffff" />
  <!-- Eyelashes -->
  <path d="M 157,175 Q 168,168 178,175" stroke="#180e24" stroke-width="3" stroke-linecap="round" fill="none" />

  <ellipse cx="232" cy="180" rx="9" ry="12" fill="#180e24" />
  <circle cx="230" cy="176" r="3.5" fill="#ffffff" />
  <circle cx="235" cy="184" r="1.5" fill="#ffffff" />
  <!-- Eyelashes -->
  <path d="M 222,175 Q 232,168 243,175" stroke="#180e24" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Cute Blush Cheeks -->
  <ellipse cx="152" cy="196" rx="9" ry="6" fill="#60a5fa" opacity="0.4" />
  <ellipse cx="248" cy="196" rx="9" ry="6" fill="#60a5fa" opacity="0.4" />

  <!-- Cute Smile with Gloss -->
  <path d="M 188,212 Q 200,224 212,212" stroke="#be123c" stroke-width="3" stroke-linecap="round" fill="#fda4af" />

  <!-- Cute Hair Accessory / Flower Pin -->
  <g transform="translate(255, 125)">
    <circle cx="0" cy="0" r="7" fill="#60a5fa" />
    <circle cx="-6" cy="-4" r="5" fill="#f472b6" />
    <circle cx="6" cy="-4" r="5" fill="#f472b6" />
    <circle cx="-6" cy="4" r="5" fill="#f472b6" />
    <circle cx="6" cy="4" r="5" fill="#f472b6" />
    <circle cx="0" cy="0" r="4" fill="#fef08a" />
  </g>

  <!-- Modern Tech Developer Glasses / Headset Accent -->
  <rect x="180" y="325" width="40" height="28" rx="6" fill="#1e1b4b" opacity="0.8" />
  <text x="200" y="344" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;dev/&gt;</text>
</svg>
